[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usageloop"
version = "1.3.4"
description = "Keep your Codex reset clock running with guarded local automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ben Thompson" }]
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
build = ["PyInstaller>=6.14,<7"]
test = ["PyYAML>=6.0,<7", "tzdata>=2025.2"]

[project.scripts]
sentinel = "sentinel.cli:main"
usageloop = "sentinel.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
