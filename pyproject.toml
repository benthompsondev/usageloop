[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-window-sentinel"
version = "0.3.0"
description = "Observe Codex windows and safely verify bounded rollover or bootstrap triggers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ben Thompson" }]
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
