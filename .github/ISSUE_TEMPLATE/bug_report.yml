name: Report a problem
description: Something not working? Tell us what happened.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a minute to help improve UsageLoop.

        Please don't include passwords, API keys, private Codex conversations, or other sensitive information.
  - type: textarea
    id: what_went_wrong
    attributes:
      label: What went wrong?
      placeholder: Tell us what happened and what you saw.
    validations:
      required: true
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else that might help?
      description: Share any extra details you remember, or skip this if you're not sure.
      placeholder: What you expected, steps that led to it, or anything else you noticed.
    validations:
      required: false
  - type: textarea
    id: diagnostic_summary
    attributes:
      label: Diagnostic summary (optional)
      description: If you have it, paste the privacy-safe output from Settings → Advanced → Copy this summary.
      render: text
    validations:
      required: false
