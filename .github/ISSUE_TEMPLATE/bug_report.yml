name: Report a problem
description: Something not working? Tell us what happened.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a minute to help improve UsageLoop.

        Please don't include passwords, API keys, private Codex conversations, or other sensitive information.
        For a security vulnerability, use GitHub's private reporting link instead of this public form:
        https://github.com/benthompsondev/usageloop/security/advisories/new
  - type: textarea
    id: what_went_wrong
    attributes:
      label: What went wrong?
      placeholder: Tell us what happened and what you saw.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
  - type: input
    id: versions
    attributes:
      label: Versions (if known)
      description: UsageLoop version from About, Windows version or Linux distribution, and Codex version if available. No account details needed.
      placeholder: "UsageLoop 1.3.4; Windows 11 or Ubuntu 24.04; Codex version if known"
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else that might help?
      description: Share any extra details you remember, or skip this if you're not sure.
      placeholder: What you expected, steps that led to it, or anything else you noticed.
    validations:
      required: false
  - type: textarea
    id: diagnostic_summary
    attributes:
      label: Diagnostic summary (optional)
      description: Open Settings → Codex connection → Technical details → Copy this summary. Review the summary before posting. Keep any attachments limited to this report.
      render: text
    validations:
      required: false
