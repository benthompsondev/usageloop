name: Request a feature
description: Have an idea? Tell us what would make UsageLoop more useful.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make UsageLoop better.

        Please don't include passwords, API keys, private Codex conversations, or other sensitive information.
  - type: textarea
    id: usefulness
    attributes:
      label: What would make UsageLoop more useful for you?
      placeholder: Tell us what you wish UsageLoop could do.
    validations:
      required: true
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else you'd like to add?
      placeholder: Add any extra context or ideas here.
    validations:
      required: false
