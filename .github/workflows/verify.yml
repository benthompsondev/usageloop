name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --editable ".[test]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests

  build-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --editable ".[build]"
          choco install innosetup --no-progress -y
      - name: Build Windows package
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/UsageLoop-Setup.exe
            dist/UsageLoop-Setup.exe.sha256
          if-no-files-found: error

  windows-install-acceptance:
    needs: build-windows-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, "0.9.1", "1.0.0", "1.0.1", "1.0.2", "1.1.2", "1.1.3", "1.1.4", "1.2.0", "1.3.0", recent-chain, legacy-chain, broken-registration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package metadata only
        run: python -m pip install --editable . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist
      - name: Download required published installers
        run: |
          $versions = switch ('${{ matrix.scenario }}') {
            '0.9.1' { @('0.9.1') }
            '1.0.0' { @('1.0.0') }
            '1.0.1' { @('1.0.1') }
            '1.0.2' { @('1.0.2') }
            '1.1.2' { @('1.1.2') }
            '1.1.3' { @('1.1.3') }
            '1.1.4' { @('1.1.4') }
            '1.2.0' { @('1.2.0') }
            '1.3.0' { @('1.3.0') }
            'recent-chain' { @('1.1.2', '1.1.3', '1.1.4') }
            'broken-registration' { @('1.0.2') }
            'legacy-chain' { @('0.9.1', '1.0.0', '1.0.1') }
            default { @() }
          }
          foreach ($version in $versions) {
            Invoke-WebRequest `
              -Uri "https://github.com/benthompsondev/usageloop/releases/download/v$version/UsageLoop-Setup.exe" `
              -OutFile "$env:RUNNER_TEMP\UsageLoop-Setup-$version.exe"
          }
      - name: Verify Windows installation integration
        run: |
          $versions = switch ('${{ matrix.scenario }}') {
            '0.9.1' { @('0.9.1') }
            '1.0.0' { @('1.0.0') }
            '1.0.1' { @('1.0.1') }
            '1.0.2' { @('1.0.2') }
            '1.1.2' { @('1.1.2') }
            '1.1.3' { @('1.1.3') }
            '1.1.4' { @('1.1.4') }
            '1.2.0' { @('1.2.0') }
            '1.3.0' { @('1.3.0') }
            'recent-chain' { @('1.1.2', '1.1.3', '1.1.4') }
            'broken-registration' { @('1.0.2') }
            'legacy-chain' { @('0.9.1', '1.0.0', '1.0.1') }
            default { @() }
          }
          $installers = @($versions | ForEach-Object { "$env:RUNNER_TEMP\UsageLoop-Setup-$_.exe" })
          .\scripts\verify-clean-install.ps1 `
            -Scenario '${{ matrix.scenario }}' `
            -PreviousInstallers $installers `
            -SkipDesktopActivation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-evidence-${{ matrix.scenario }}
          path: artifacts/install-acceptance/
          if-no-files-found: ignore
