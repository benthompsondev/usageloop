name: verify

on:
  push:
    branches: [main, "codex/linux-beta"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --editable ".[test]"
      - name: Test shared and Linux contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests

  build-linux-package:
    needs: linux-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --editable ".[build,test]"
      - name: Build Linux package
        run: ./scripts/build-linux.sh
      - name: Smoke packaged app without provider work
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/usageloop-smoke"
          tar -xzf dist/UsageLoop-Linux-x86_64.tar.gz -C "$RUNNER_TEMP/usageloop-smoke"
          timeout 20s "$RUNNER_TEMP/usageloop-smoke/UsageLoop-Linux-x86_64/UsageLoop/UsageLoop" --package-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/UsageLoop-Linux-x86_64.tar.gz
            dist/UsageLoop-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --editable ".[test]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests

  build-windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --editable ".[build]"
          choco install innosetup --no-progress -y
      - name: Build Windows package
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/UsageLoop-Setup.exe
            dist/UsageLoop-Setup.exe.sha256
          if-no-files-found: error

  windows-install-acceptance:
    needs: build-windows-package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, "0.9.1", "1.0.0", "1.0.1", "1.0.2", legacy-chain, broken-registration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package metadata only
        run: python -m pip install --editable . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist
      - name: Download required published installers
        run: |
          $versions = switch ('${{ matrix.scenario }}') {
            '0.9.1' { @('0.9.1') }
            '1.0.0' { @('1.0.0') }
            '1.0.1' { @('1.0.1') }
            '1.0.2' { @('1.0.2') }
            'broken-registration' { @('1.0.2') }
            'legacy-chain' { @('0.9.1', '1.0.0', '1.0.1') }
            default { @() }
          }
          foreach ($version in $versions) {
            Invoke-WebRequest `
              -Uri "https://github.com/benthompsondev/usageloop/releases/download/v$version/UsageLoop-Setup.exe" `
              -OutFile "$env:RUNNER_TEMP\UsageLoop-Setup-$version.exe"
          }
      - name: Verify Windows installation integration
        run: |
          $versions = switch ('${{ matrix.scenario }}') {
            '0.9.1' { @('0.9.1') }
            '1.0.0' { @('1.0.0') }
            '1.0.1' { @('1.0.1') }
            '1.0.2' { @('1.0.2') }
            'broken-registration' { @('1.0.2') }
            'legacy-chain' { @('0.9.1', '1.0.0', '1.0.1') }
            default { @() }
          }
          $installers = @($versions | ForEach-Object { "$env:RUNNER_TEMP\UsageLoop-Setup-$_.exe" })
          .\scripts\verify-clean-install.ps1 `
            -Scenario '${{ matrix.scenario }}' `
            -PreviousInstallers $installers `
            -SkipDesktopActivation
