<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>UsageLoop: schedule your Codex 5-hour reset clock</title>
  <desc>Free and open source for Windows and Linux. Each automatic start uses subscription allowance. No extra quota or limit bypass.</desc>
  <rect width="1280" height="640" fill="#0a111c"/>
  <rect x="0" y="0" width="1280" height="8" fill="#22d3a1"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="64" y="98" fill="#edf3fa" font-size="34" font-weight="700">Usage<tspan fill="#22d3a1">Loop</tspan></text>
    <text x="1216" y="94" text-anchor="end" fill="#c2cedc" font-size="24">Windows + Linux</text>
    <text x="64" y="219" fill="#edf3fa" font-size="62" font-weight="700">Schedule your</text>
    <text x="64" y="292" fill="#edf3fa" font-size="62" font-weight="700">Codex 5-hour</text>
    <text x="64" y="365" fill="#22d3a1" font-size="62" font-weight="700">reset clock.</text>
    <text x="64" y="433" fill="#c2cedc" font-size="25">Let the clock start before you sit down.</text>
    <g transform="translate(956 260)">
      <circle r="112" fill="#101b29" stroke="#253449" stroke-width="6"/>
      <path d="M 0 -112 A 112 112 0 1 1 -97 -56" fill="none" stroke="#22d3a1" stroke-width="9" stroke-linecap="round"/>
      <path d="M 0 -56 V 0 L 43 25" fill="none" stroke="#edf3fa" stroke-width="9" stroke-linecap="round"/>
      <circle r="7" fill="#22d3a1"/>
    </g>
    <text x="956" y="424" text-anchor="middle" fill="#c2cedc" font-size="23">No API key. No telemetry.</text>
    <path d="M 64 490 H 1216" stroke="#253449" stroke-width="2"/>
    <text x="64" y="544" fill="#edf3fa" font-size="24">Each start uses subscription allowance. No extra quota. No limit bypass.</text>
    <text x="64" y="592" fill="#8b99aa" font-size="22">Free and open source</text>
    <text x="1216" y="592" text-anchor="end" fill="#22d3a1" font-size="22">github.com/benthompsondev/usageloop</text>
  </g>
</svg>
